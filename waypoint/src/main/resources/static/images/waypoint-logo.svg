<svg width="240" height="50" viewBox="0 0 240 50"
     role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Waypoint logo</title>
  <desc>Waypoint URL shortener logo</desc>

  <style>
    .logo-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      fill: #000000;
    }
    .logo-sub {
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      fill: #9e9aa7;
    }
  </style>

  <!-- Location pin -->
  <g transform="translate(20, 25)">
    <ellipse cx="0" cy="18" rx="7" ry="3"
             fill="#1a9f9f" opacity="0.3"/>
    <path d="M0 -20 C-11 -20 -19 -12 -19 -2
             C-19 9 -10 18 0 30
             C10 18 19 9 19 -2
             C19 -12 11 -20 0 -20 Z"
          fill="#2acfcf"/>
    <circle cx="0" cy="-2" r="7" fill="#3b3054"/>
    <circle cx="0" cy="-2" r="3.5" fill="#2acfcf"/>
  </g>

  <!-- Waypoint text -->
  <text x="46" y="22" font-size="20"
        class="logo-text" letter-spacing="-0.5">
    Waypoint
  </text>

  <!-- Subtitle -->
  <text x="47" y="36" font-size="8"
        class="logo-sub" letter-spacing="2">
    URL SHORTENER
  </text>

  <!-- Cyan accent line -->
  <line x1="47" y1="41" x2="200" y2="41"
        stroke="#2acfcf" stroke-width="1.5"
        stroke-linecap="round"/>

</svg>